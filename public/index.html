<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OwnMusic</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header>
    <h1>OwnMusic</h1>
    <p class="tag">Own albums, not rentals. £10 a month gets you 2 albums to keep. 90% goes to the artist.</p>
    <div id="who"></div>
  </header>

  <section id="login" hidden>
    <form id="login-form">
      <label>Your name <input name="name" required maxlength="40" autocomplete="username" /></label>
      <label>Password <input name="password" type="password" required minlength="6" autocomplete="current-password" /></label>
      <button>Sign in</button>
    </form>
    <p class="muted">New here? Pick a name and password and you're in. No real money changes hands.</p>
  </section>

  <nav id="tabs" hidden>
    <button data-tab="albums" class="on">Albums</button>
    <button data-tab="collection">My collection</button>
    <button data-tab="plan">My plan</button>
    <button data-tab="payouts">Artist payouts</button>
    <button data-tab="artist">For artists</button>
  </nav>

  <main>
    <section data-panel="albums">
      <div id="credits-bar"></div>
      <ul id="albums" class="cards"></ul>
    </section>
    <section data-panel="collection" hidden><ul id="collection" class="cards"></ul></section>
    <section data-panel="plan" hidden><div id="plan"></div></section>
    <section data-panel="payouts" hidden><div id="payouts"></div></section>
    <section data-panel="artist" hidden><div id="artist"></div></section>
  </main>

  <footer id="player" hidden>
    <div><strong id="now-title"></strong> <span id="now-artist" class="muted"></span></div>
    <audio id="audio" controls preload="none"></audio>
    <div id="play-status" class="muted"></div>
  </footer>

  <script src="/app.js" type="module"></script>
</body>
</html>
